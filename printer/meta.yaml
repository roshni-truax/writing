# The page a manuscript gets before its own frontmatter says anything.
# printer.py reads this the same way it reads a document's frontmatter, and
# a document setting any of these wins over the value here. The margins take
# the words a document takes - horizontal, vertical, top, bottom, left,
# right - and printer translates them for typst on the way out.
papersize: a5
fontsize: 10pt
linestretch: 1.15
# book margins for a page this size, slightly more below so the page number
# has room
margin:
  horizontal: 1.6cm
  top: 1.7cm
  bottom: 2cm
