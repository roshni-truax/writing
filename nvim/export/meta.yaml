# Page layout for the pdf export (see lua/plugins/export.lua). These are
# pandoc variables; the nested margin cannot be set from the command line,
# which is why this file exists. A document's own frontmatter wins over
# anything here, so a single manuscript can override any of it.
papersize: a5
fontsize: 10pt
linestretch: 1.15
# book margins for a page this size, slightly more below so the page number
# has room
margin:
  x: 1.6cm
  top: 1.7cm
  bottom: 2cm
